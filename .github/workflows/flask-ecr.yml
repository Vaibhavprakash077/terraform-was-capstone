name: Production CICD

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
jobs:
    test:
        name: Python Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                python-version: "3.14"
                cache: pip
                cache-dependency-path: app/requirements-dev.txt
            - name: Installing dependency
              run: python -m pip install -r app/requirements-dev.txt
            - name: Pytest
              run: python -m pytest app/tests -v
    docker-build:
        name: docker-build
        runs-on: ubuntu-latest
        needs: test
        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4
            - name: building image
              run: docker build --platform linux/amd64 -t flask-app:ci ./app

            # Full scan: preserve every HIGH/CRITICAL finding
            - name: Trivy full vulnerability report
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                image-ref: flask-app:ci
                scan-type: image
                scanners: vuln
                format: json
                output: trivy-results.json
                severity: HIGH,CRITICAL
                exit-code: '0'

            - name: Upload Trivy report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: trivy-vulnerability-report
                path: trivy-results.json
                if-no-files-found: error
                retention-days: 14

            # Enforce fixable HIGH/CRITICAL findings in OS and application packages.
            - name: Trivy security gate
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                image-ref: flask-app:ci
                scan-type: image
                scanners: vuln
                vuln-type: os,library
                severity: HIGH,CRITICAL
                ignore-unfixed: 'true'
                exit-code: '1'

            - name: Configure AWS Credentials
              if: >-
                github.event_name == 'workflow_dispatch' &&
                github.ref == 'refs/heads/main' &&
                vars.ECR_PUBLISH_ENABLED == 'true'
              uses: aws-actions/configure-aws-credentials@v6
              with:
                role-to-assume: arn:aws:iam::207224908189:role/GithubActions-ECR-Push-Role
                aws-region: ap-south-1
            - name: Verfify AWS identity
              if: >-
                github.event_name == 'workflow_dispatch' &&
                github.ref == 'refs/heads/main' &&
                vars.ECR_PUBLISH_ENABLED == 'true'
              run: aws sts get-caller-identity
            - name: Login to Amazon ECR
              if: >-
                  github.event_name == 'workflow_dispatch' &&
                  github.ref == 'refs/heads/main' &&
                  vars.ECR_PUBLISH_ENABLED == 'true'
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2
            - name: Tag and push Docker image to ECR
              if: >-
                  github.event_name == 'workflow_dispatch' &&
                  github.ref == 'refs/heads/main' &&
                  vars.ECR_PUBLISH_ENABLED == 'true'
              env:
                REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                REPOSITORY: dev-flask-app
                IMAGE_TAG: ${{ github.sha }}
              run: |
                docker tag flask-app:ci "${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}"
                docker push "${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}"
