name: Terraform Apply

on:
  workflow_dispatch:

concurrency:
  group: terraform-dev-apply
  cancel-in-progress: false

jobs:
  terraform:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: terraform-apply
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: 'true'
      TF_WORKSPACE: default
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.4'
          terraform_wrapper: false

      - name: Configure restricted planning session
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ap-south-1
          allowed-account-ids: '207224908189'
          role-to-assume: arn:aws:iam::207224908189:role/GithubActions-Terraform-Apply-Role
          role-session-name: DevPlan-${{ github.run_id }}
          # STS intersects this allowlist with the role's resource restrictions.
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[
            {"Effect":"Allow","Action":["ec2:Describe*","ecs:Describe*","ecs:List*",
            "elasticloadbalancing:Describe*","application-autoscaling:Describe*",
            "application-autoscaling:ListTagsForResource","cloudwatch:DescribeAlarms","cloudwatch:ListTagsForResource",
            "logs:DescribeLogGroups","logs:ListTagsForResource","ecr:Describe*","ecr:ListTagsForResource",
            "iam:Get*","iam:List*","s3:ListBucket","s3:GetObject"],"Resource":"*"},
            {"Effect":"Allow","Action":["s3:PutObject","s3:DeleteObject"],
            "Resource":"arn:aws:s3:::tfstate-vaibhav-capstone-207224908189-aps1/terraform-aws-capstone/dev/terraform.tfstate.tflock"}]}

      - name: Initialize and validate dev
        run: |
          terraform -chdir=environments/dev init -input=false -lockfile=readonly
          terraform -chdir=environments/dev validate

      - name: Save plan and validate workload boundary
        run: bash .github/scripts/terraform-apply.sh plan

      - name: Configure deployment session
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ap-south-1
          allowed-account-ids: '207224908189'
          role-to-assume: arn:aws:iam::207224908189:role/GithubActions-Terraform-Apply-Role
          role-session-name: DevApply-${{ github.run_id }}

      - name: Apply the local saved plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/terraform-apply.sh apply

      - name: Remove local plan
        if: always()
        run: rm -f "$RUNNER_TEMP/dev.tfplan"
