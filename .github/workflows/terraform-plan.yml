
name: Terraform Plan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment: terraform-plan

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::207224908189:role/GithubActions-Terraform-Plan-Role
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Initialize Terraform backend
        run: terraform -chdir=environments/dev init -input=false -lockfile=readonly
      - name: Verify Terraform state list
        run: terraform -chdir=environments/dev state list

      - name: Terraform plan
        shell: bash
        run: |
          umask 077
          plan_file="$RUNNER_TEMP/dev.tfplan"
          log_file="$RUNNER_TEMP/terraform-plan.log"
          trap 'rm -f "$plan_file" "$log_file"' EXIT

          set +e
          terraform -chdir=environments/dev plan \
            -input=false \
            -no-color \
            -lock-timeout=5m \
            -detailed-exitcode \
            -out="$plan_file" \
            > "$log_file" 2>&1
          status=$?
          set -e

          case "$status" in
            0) echo "Plan succeeded: no changes." ;;
            2) echo "Plan succeeded: changes detected." ;;
            *)
              echo "::error::Terraform planning failed (exit $status)."
              exit "$status"
              ;;
          esac

          {
            echo "## Terraform Plan — dev"
            echo ""
            echo "Commit: \`$GITHUB_SHA\`"
            echo ""
            echo "| Action | Terraform resource address |"
            echo "|---|---|"

            terraform -chdir=environments/dev show -json "$plan_file" |
              jq -r '
                .resource_changes[]?
                | select(.change.actions != ["no-op"])
                | "| `" + (.change.actions | join(" + ")) + "` | `" + .address + "` |"
              '
          } >> "$GITHUB_STEP_SUMMARY"
